name: CD - Execution Service (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cd-execution-production
  cancel-in-progress: false

env:
  EKS_CLUSTER_NAME: techchallenge-dev
  NAMESPACE: execution
  DEPLOYMENT: execution-service
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'execution-service' }}

jobs:
  # Mesmos testes, lint, cobertura e Sonar do CI antes de qualquer deploy
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy no EKS
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@463133d79af6d001e45482f356e244208e65f0c5 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem (tag = SHA do commit)
        id: imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "${{ secrets.AWS_REGION }}"
          # Namespace e Secret rabbitmq vêm do Terraform (repo TechChallengerFiap-K8s)
          kubectl get namespace "$NAMESPACE"
          kubectl -n "$NAMESPACE" get secret rabbitmq

      - name: Criar/atualizar o Secret da aplicação
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -euo pipefail
          for VAR in MONGO_URL JWT_SECRET NEW_RELIC_LICENSE_KEY; do
            [ -n "${!VAR}" ] || { echo "::error::Secret $VAR não configurado"; exit 1; }
          done
          kubectl -n "$NAMESPACE" create secret generic execution-secret \
            --from-literal=MONGO_URL="$MONGO_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests (Kustomize) com a imagem nova
        env:
          IMAGE: ${{ steps.imagem.outputs.image }}
        run: |
          kubectl kustomize k8s \
            | sed "s#image: execution-service:latest#image: ${IMAGE}#" \
            | kubectl apply -f -
          # Secret alterado não reinicia os pods sozinho
          kubectl -n "$NAMESPACE" rollout restart deployment/"$DEPLOYMENT"

      - name: Aguardar rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/"$DEPLOYMENT" --timeout=300s

      - name: Smoke test (/health dentro do cluster)
        run: |
          kubectl -n "$NAMESPACE" exec deploy/"$DEPLOYMENT" -c execution -- \
            node -e 'fetch("http://localhost:3000/health").then(r=>r.json()).then(j=>{console.log(j);if(j.status==="DOWN")process.exit(1)})'

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe deployment "$DEPLOYMENT" || true
          kubectl -n "$NAMESPACE" logs deploy/"$DEPLOYMENT" --all-containers --tail=100 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -30 || true
