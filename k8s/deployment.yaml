apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  labels:
    app: execution-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: execution-service

  template:
    metadata:
      labels:
        app: execution-service

    spec:
      containers:
        - name: execution
          image: execution-service

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: execution-config
            # MONGO_URL (Atlas M0), JWT_SECRET, NEW_RELIC_LICENSE_KEY
            - secretRef:
                name: execution-secret

          env:
            # Secret criado pelo Terraform (repo TechChallengerFiap-K8s)
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_URL

            - name: NEW_RELIC_APP_NAME
              value: "oficina-execution"

            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
