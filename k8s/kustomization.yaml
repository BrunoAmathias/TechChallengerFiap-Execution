apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: execution

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

# O cd.yml troca a imagem pela do ECR com a tag do commit:
#   kustomize edit set image execution-service=<registry>/execution-service:<sha>
images:
  - name: execution-service
    newName: execution-service
    newTag: latest
